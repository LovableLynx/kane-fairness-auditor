{% extends "base.html" %}
{% block body %}
<h1>Candidates</h1>
<p class="muted">Synthetic profiles from FairCVdb. Open a candidate to run the AI screening score.</p>
<table class="list">
  <thead><tr><th>ID</th><th>Name</th><th>Occupation</th><th></th></tr></thead>
  <tbody>
  {% for c in candidates %}
    <tr>
      <td>C-{{ '%04d'|format(c.id) }}</td>
      <td>{{ c.first_name }}</td>
      <td>{{ c.occupation }}</td>
      <td><a href="{{ url_for('candidate', cid=c.id) }}">Open</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
