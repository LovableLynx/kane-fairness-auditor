{% extends "shell.html" %}
{% block body %}
<form class="box" method="post" action="{{ url_for('run_match', did=d.id) }}" data-busy="Matching…">
  <h1>Ready to match?</h1>
  <p class="muted">Role: <b>{{ role.title }}</b></p>
  <pre>{{ d.cv }}</pre>
  <p><a href="{{ url_for('step_cv', did=d.id) }}">← Edit CV</a></p>
  <button class="go" type="submit"><span class="lbl">Run match ✨</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></button>
  <p class="wait" role="status">Reading the CV with the language model. The first match after a quiet spell can take up to a minute while the model loads.</p>
</form>
{% endblock %}
