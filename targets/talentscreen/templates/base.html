<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TalentScreen{% endblock %}</title>
<style>
  :root { --bg:#0e0f13; --panel:#171920; --line:#2a2d38; --fg:#eceef3; --muted:#9097a8;
          --accent:#7c5cff; --accent2:#22d3a6; --bad:#ff5d6c; --ok:#22d3a6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  a { color:var(--accent); }
  header { display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--line); }
  .logo { font-weight:800; letter-spacing:-.02em; font-size:18px; }
  .logo span { color:var(--accent); }
  .job { margin-left:auto; color:var(--muted); font-size:13px; }
  main { max-width:980px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0 0 4px; }
  .muted { color:var(--muted); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:20px; margin-top:22px; }
  @media (max-width:760px){ .grid { grid-template-columns:1fr; } }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center; transition:.15s; cursor:pointer; }
  .drop.over { border-color:var(--accent); background:#7c5cff14; }
  .drop b { display:block; font-size:16px; margin-bottom:4px; }
  textarea { width:100%; min-height:190px; background:#0b0c10; color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:12px; font:13px/1.45 ui-monospace, Consolas, monospace; }
  .or { text-align:center; color:var(--muted); margin:14px 0; font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
  button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:600 15px system-ui; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:9px 6px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.06em; }
  .badge.ok { background:#22d3a61f; color:var(--ok); } .badge.bad { background:#ff5d6c1f; color:var(--bad); }
  .error { background:#ff5d6c1f; color:var(--bad); padding:10px 14px; border-radius:10px; margin-top:14px; }
  .file-name { margin-top:8px; color:var(--accent2); font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="logo">Talent<span>Screen</span></div>
  <div class="job">Hiring for <b>{{ job.title }}</b> · {{ job.team }} · {{ job.location }}</div>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
