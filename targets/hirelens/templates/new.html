{% extends "layout.html" %}
{% block title %}Add applicant · HireLens{% endblock %}
{% block body %}
<h1>Add applicant</h1>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form class="card" method="post" action="{{ url_for('create_applicant') }}">
  <label for="full_name">Full name (optional)</label>
  <input id="full_name" name="full_name" placeholder="Taken from the résumé if blank">
  <label for="resume">Résumé</label>
  <textarea id="resume" name="resume" placeholder="Paste résumé text"></textarea>
  <p style="margin-top:18px"><button class="btn" type="submit">Evaluate applicant</button></p>
</form>
{% endblock %}
