<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HireLens ATS{% endblock %}</title>
<style>
  :root { --bg:#f4f6f9; --side:#12355b; --fg:#1b2430; --muted:#5f6b7a; --line:#dde3ea; --card:#fff; --brand:#0a7cff; --good:#0f8a5f; --warn:#b54708; }
  * { box-sizing:border-box; }
  body { margin:0; display:flex; min-height:100vh; background:var(--bg); color:var(--fg); font:14px/1.5 Georgia, "Times New Roman", serif; }
  nav { width:210px; background:var(--side); color:#cfe0f5; padding:22px 16px; flex-shrink:0; }
  nav .brand { color:#fff; font:700 20px Georgia, serif; margin-bottom:26px; }
  nav a { display:block; color:#cfe0f5; text-decoration:none; padding:8px 10px; border-radius:6px; font-family:system-ui, sans-serif; }
  nav a:hover, nav a.on { background:#ffffff1a; color:#fff; }
  .content { flex:1; padding:30px 34px; max-width:900px; }
  @media (max-width:700px){ body { display:block; } nav { width:auto; } .content { padding:20px 16px; } }
  h1 { font-weight:400; font-size:30px; margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:22px; margin-bottom:18px; }
  label { display:block; font:600 12px system-ui; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:3px; font:14px system-ui; background:#fbfcfd; }
  textarea { min-height:220px; font-family:ui-monospace, Consolas, monospace; font-size:12.5px; }
  .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:3px; padding:10px 18px; font:600 14px system-ui; cursor:pointer; text-decoration:none; }
  table { width:100%; border-collapse:collapse; font-family:system-ui; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .muted { color:var(--muted); font-family:system-ui; }
  .err { background:#fef3f2; color:#b42318; padding:10px 12px; border-radius:3px; font-family:system-ui; }
</style>
</head>
<body>
<nav>
  <div class="brand">HireLens</div>
  <a href="{{ url_for('pipeline') }}" class="{{ 'on' if request.endpoint == 'pipeline' }}">Pipeline</a>
  <a href="{{ url_for('new_applicant') }}" class="{{ 'on' if request.endpoint == 'new_applicant' }}">Add applicant</a>
  <a href="#" aria-disabled="true">Reports</a>
</nav>
<div class="content">{% block body %}{% endblock %}</div>
</body>
</html>
