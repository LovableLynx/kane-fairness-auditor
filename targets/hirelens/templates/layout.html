<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HireLens ATS{% endblock %}</title>
<style>
  :root { --bg:#f4f6f9; --side:#12355b; --fg:#1b2430; --muted:#556170; --line:#dde3ea; --card:#fff; --brand:#0a64d6; --good:#0d7a54; --warn:#a0410a;
          --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing:border-box; }
  body { margin:0; display:flex; min-height:100vh; background:var(--bg); color:var(--fg); font:15px/1.55 Georgia, "Times New Roman", serif; }
  a { color:var(--brand); }
  :focus-visible { outline:3px solid #f2b705; outline-offset:2px; border-radius:3px; }
  .skip { position:absolute; left:12px; top:-60px; background:#fff; color:#000; padding:8px 12px; z-index:10; }
  .skip:focus { top:12px; }
  nav { width:220px; background:var(--side); color:#d7e5f7; padding:22px 16px; flex-shrink:0; display:flex; flex-direction:column; }
  nav .brand { color:#fff; font:700 21px Georgia, serif; margin-bottom:26px; display:flex; align-items:center; gap:10px; }
  nav .brand::before { content:""; width:18px; height:18px; border:3px solid #fff; border-radius:50%; box-shadow: inset 0 0 0 3px var(--side), inset 0 0 0 9px #7fb3ff; }
  nav a { display:block; color:#d7e5f7; text-decoration:none; padding:9px 12px; border-radius:6px; font-family:system-ui, sans-serif; transition: background .2s var(--ease); }
  nav a:hover, nav a[aria-current="page"] { background:#ffffff1f; color:#fff; }
  nav .foot { margin-top:auto; font:12px/1.4 system-ui; color:#a9bfdb; padding-top:24px; }
  nav .foot a { padding:0; display:inline; color:#d7e5f7; text-decoration:underline; }
  .content { flex:1; padding:32px 36px; max-width:920px; min-width:0; }
  @media (max-width:720px){ body { display:block; } nav { width:auto; flex-direction:row; flex-wrap:wrap; align-items:center; gap:4px; padding:12px 16px; }
    nav .brand { margin:0 auto 0 0; } nav .foot { display:none; } .content { padding:22px 16px; } }
  h1 { font-weight:400; font-size:clamp(26px, 3.4vw, 32px); margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:22px; margin-bottom:18px; box-shadow:0 1px 2px #1b24300d;
          animation: rise .4s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } }
  label { display:block; font:600 12px system-ui; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid #c6cfda; border-radius:4px; font:14px system-ui; background:#fbfcfd; transition: border-color .2s, box-shadow .2s; }
  input:focus, textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px #0a64d633; }
  textarea { min-height:220px; font-family:ui-monospace, Consolas, monospace; font-size:12.5px; resize:vertical; }
  .btn { display:inline-flex; align-items:center; gap:8px; background:var(--brand); color:#fff; border:0; border-radius:4px; padding:11px 18px; font:600 14px system-ui; cursor:pointer; text-decoration:none;
         transition: background .2s, transform .1s; }
  .btn:hover { background:#0852b0; color:#fff; } .btn:active { transform:translateY(1px); }
  .btn[aria-busy="true"] { cursor:progress; opacity:.85; }
  .spin { display:none; width:14px; height:14px; border:2px solid #fff6; border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  [aria-busy="true"] .spin { display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-family:system-ui; }
  th, td { text-align:left; padding:11px 8px; border-bottom:1px solid var(--line); }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  tbody tr:hover { background:#f7f9fc; }
  .muted { color:var(--muted); font-family:system-ui; }
  .err { background:#fef3f2; color:#9e1c12; padding:10px 12px; border-radius:4px; font-family:system-ui; border:1px solid #f5c2bd; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font:600 12px system-ui; }
  .pill.go { background:#e3f4ec; color:var(--good); } .pill.stop { background:#fbeee6; color:var(--warn); }
  .demo-note { font:12.5px system-ui; color:var(--muted); margin-top:28px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<nav aria-label="Main">
  <div class="brand">HireLens</div>
  <a href="{{ url_for('pipeline') }}" {% if request.endpoint == 'pipeline' %}aria-current="page"{% endif %}>Pipeline</a>
  <a href="{{ url_for('new_applicant') }}" {% if request.endpoint == 'new_applicant' %}aria-current="page"{% endif %}>Add applicant</a>
  <div class="foot">Fictional demo ATS for fairness research. <a href="{{ legal_url }}#privacy">Privacy</a></div>
</nav>
<div class="content" id="main">
  {% block body %}{% endblock %}
  <p class="demo-note">HireLens is a fictional demo, not affiliated with any company. Use sample résumés only; data is held in memory and cleared on restart.</p>
</div>
</body>
</html>
