services:
  - type: web
    name: kane-fairness-auditor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn serve:app --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
