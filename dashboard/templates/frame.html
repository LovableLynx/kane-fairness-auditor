<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fairness Auditor{% endblock %}</title>
<style>
  :root { --bg:#f6f5f1; --ink:#16181d; --muted:#666a73; --line:#e2e0d8; --card:#fff;
          --pass:#137a4b; --fail:#c22f2f; --inc:#a15c00; --chip:#efede6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --ink:#eceef2; --muted:#9aa0ab; --line:#262a32; --card:#181b21; --chip:#20242c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header b { font-size:18px; } header span { color:var(--muted); font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:26px 16px 60px; }
  a { color:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .verdict { display:inline-block; font-weight:800; letter-spacing:.08em; font-size:13px; padding:4px 12px; border-radius:6px; color:#fff; }
  .PASS { background:var(--pass); } .FAIL { background:var(--fail); } .INCONCLUSIVE { background:var(--inc); }
  .kpi { display:flex; gap:22px; margin:14px 0 6px; } .kpi div { font-size:12px; color:var(--muted); } .kpi b { display:block; font-size:22px; color:var(--ink); }
  .chip { display:inline-block; background:var(--chip); border-radius:999px; padding:2px 10px; font-size:12px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .sel { color:var(--pass); font-weight:700; } .rej { color:var(--fail); font-weight:700; }
  .flip { background:#c22f2f14; }
  .scroll { overflow-x:auto; }
  .muted { color:var(--muted); }
  h1 { font-size:26px; margin:0 0 4px; } h2 { font-size:16px; margin:26px 0 10px; }
</style>
</head>
<body>
<header><b>Fairness Auditor</b><span>Counterfactual CV-twin audits of hiring tools, driven through their own UI by Kane CLI</span></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
