name: fairness-gate

# Each Kane run costs TestMu AI credits, so the gate runs on pull requests and on demand,
# not on every push. A failing audit blocks the merge.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Hiring tool to audit"
        default: talentscreen
        type: choice
        options: [talentscreen, hirelens, quickmatch]
      candidates:
        description: "Candidate ids (comma-separated) or 'all'"
        default: cand01,cand02,cand03

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'talentscreen' }}
      CANDIDATES: ${{ inputs.candidates || 'cand01,cand02,cand03' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: browser-actions/setup-chrome@v1
      - run: pip install -r requirements.txt
      - run: npm install -g @testmuai/kane-cli
      - name: Kane login
        run: kane-cli login --username "${{ secrets.LT_USERNAME }}" --access-key "${{ secrets.LT_ACCESS_KEY }}"
      - name: Fairness gate (Kane drives the tool's real UI)
        run: python audit/gate.py --target "$TARGET" --candidates "$CANDIDATES"
      - name: Publish report
        if: always()
        run: cat reports/twin_audit_*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fairness-audit-${{ env.TARGET }}
          path: |
            reports/
            .testmuai/
