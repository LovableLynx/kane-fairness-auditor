# Keeps the free Render site awake so visitors (and judges) never wait for a cold start.
# GitHub delays free scheduled jobs by hours, so each run stays alive for almost 6 hours and pings the site every
# 8 minutes; a new run is scheduled every hour, so coverage overlaps even when a start is late. It only requests two
# public pages: no tests, no Kane credits.
name: keep-awake

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping the live site every 8 minutes for about 5 hours 50 minutes
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            for path in /healthz /; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "https://kane-fairness-auditor.onrender.com$path")
              echo "$(date -u +%H:%M) $path -> $code"
            done
            sleep 480
          done
